<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shabnam — CSS on DOT Diagrams</title>
    <link id="app-css" rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main class="col">
      <nav class="row">
        <img alt="" />
        <b>Shabnam</b>
        <button data-action="draw" title="Cmd/Ctrl+Enter">Draw</button>
        <button data-action="open" title="Cmd/Ctrl+O">Open</button>
        <button data-action="save" title="Cmd/Ctrl+S">Save</button>
        <button data-action="load-dot" title="Cmd/Ctrl+L">Load DOT</button>
        <button data-action="export-picture" title="Cmd/Ctrl+P">Export…</button>
        <button data-action="export-html" title="Cmd/Ctrl+E">HTML</button>
        <input type="file" accept=".json" data-picks="project" hidden />
        <input type="file" accept=".dot,.gv" data-picks="dot" hidden />
      </nav>
      <article id="diagram-canvas" tabindex="0">
        <div id="diagram-html"></div>
        <svg id="diagram-svg">
          <g id="cluster-shells"></g>
          <g id="node-shells"></g>
          <g id="connector-paths"></g>
        </svg>
        <div id="annotation-html"></div>
        <style id="style-css"></style>
        <script id="action-js"></script>
      </article>
      <div class="checks pin" title="Pin the aside"></div>
      <div id="hover-zone" hidden></div>
    </main>

    <aside class="col glass">
      <nav class="radios"></nav>
      <section data-tab="dot"><textarea spellcheck="false"></textarea></section>
      <section data-tab="styles" hidden>
        <div class="checks"></div>
        <div class="rows"></div>
        <datalist id="selector-list"></datalist>
        <datalist id="property-list">
          <option value="@apply"></option>
          <option value="color"></option>
          <option value="background"></option>
          <option value="background-color"></option>
          <option value="border-color"></option>
          <option value="fill"></option>
          <option value="stroke"></option>
          <option value="border-width"></option>
          <option value="border-radius"></option>
          <option value="stroke-width"></option>
          <option value="font-family"></option>
          <option value="font-size"></option>
          <option value="font-weight"></option>
          <option value="padding"></option>
          <option value="gap"></option>
          <option value="opacity"></option>
          <option value="box-shadow"></option>
        </datalist>
      </section>
      <section data-tab="notes" hidden><div class="rows notes"></div></section>
      <section data-tab="script" hidden><textarea spellcheck="false"></textarea></section>
    </aside>

    <dialog class="paper">
      <form method="dialog" class="col">
        <div class="radios"></div>
        <div class="checks"></div>
        <label>Scale <input type="number" name="scale" min="1" step="1" value="3" /></label>
        <div class="row">
          <button value="ok">Export</button>
          <button value="cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <template id="choice-template"><label><input /><span></span></label></template>
    <template id="row-template">
      <div class="row"><button type="button" value="drop" title="remove this row">❌</button><button type="button" value="add" title="insert a row below">➕</button></div>
    </template>

    <script id="app-js" type="module" src="./index.js"></script>
  </body>
</html>
