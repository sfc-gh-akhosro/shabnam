<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shabnam — ui lab</title>
    <link rel="stylesheet" href="/src/app.css" />
    <link rel="stylesheet" href="/lab.css" />
  </head>
  <body>
    <main class="col">
      <nav class="row">
        <img src="/icon/shabnam-logo.svg" alt="" />
        <b>Shabnam</b>
        <button data-command="draw">Draw</button>
        <button data-command="open">Open</button>
        <button data-command="save">Save</button>
        <button data-command="export-picture">Export…</button>
        <button data-command="export-html">HTML</button>
        <button data-command="save-styles">Save styles</button>
      </nav>
      <article id="diagram-canvas">
        <div id="diagram-html"></div>
        <svg id="diagram-svg">
          <g id="cluster-shells"></g>
          <g id="node-shells"></g>
          <g id="connector-paths"></g>
        </svg>
        <div id="annotation-html"></div>
        <style id="style-css"></style>
        <script id="action-js"></script>
      </article>
      <div class="checks pin"></div>
      <div id="hover-zone"></div>
    </main>

    <aside class="col glass">
      <nav class="radios"></nav>
      <section data-tab="dot"><textarea spellcheck="false"></textarea></section>
      <section data-tab="styles" hidden>
        <div class="checks"></div>
        <div class="rows"></div>
      </section>
      <section data-tab="notes" hidden><div class="rows notes"></div></section>
      <section data-tab="script" hidden><textarea spellcheck="false"></textarea></section>
    </aside>

    <dialog class="paper">
      <form method="dialog" class="col">
        <div class="radios"></div>
        <div class="checks"></div>
        <label>Scale <input type="number" name="scale" min="1" step="1" value="3" /></label>
        <div class="row">
          <button value="ok">Export</button>
          <button value="cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <template id="choice-template"><label><input /><span></span></label></template>
    <template id="row-template">
      <div class="row"><button type="button" value="drop">❌</button><button type="button" value="add">➕</button></div>
    </template>

    <pre id="probe-log"></pre>
    <script type="module" src="/lab.js"></script>
  </body>
</html>
