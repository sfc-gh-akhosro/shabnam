<!doctype html>
<meta charset="utf-8">
<title>connectors2: stab, share, lane + ports</title>
<style>
  body { font: 13px system-ui; margin: 24px; background: white; color: black; }
  #diagram-canvas { --gap: 5em; --clear: 2em; --inset: 6px; --edge-radius: 6px; --lane: 6px;
    position: relative; display: flex; justify-content: stretch; gap: var(--gap);
    width: max-content; padding: var(--gap); outline: 1px dashed #ccc; }
  #diagram-canvas.lr { flex-direction: row; }
  #diagram-canvas.td { flex-direction: column; }
  .rank { display: flex; justify-content: start; gap: var(--gap); }
  .lr .rank { flex-direction: column; }
  .td .rank { flex-direction: row; }
  .td .node[style*="margin-top"] { margin-top: 0 !important; margin-left: 40px; }
  .node { border: 1px solid; padding: 4px 8px; }
  .lr .node { height: var(--l, auto); }
  .td .node { width: var(--l, auto); }
  #diagram-svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  path.edge { fill: none; stroke: black; stroke-width: 1.5; marker-end: url(#arrow); }
</style>

<button id="toggle">LR / TD</button> <span id="score"></span>

<article id="diagram-canvas" class="lr">
  <div class="rank"><div class="node" id="geap" style="--l:70px">geap</div><div class="node" id="bq" style="--l:70px">bq</div><div class="node" id="gcs">gcs</div></div>
  <div class="rank"><div class="node" id="runtime" style="margin-top:40px">runtime</div><div class="node" id="horizon" style="--l:50px">horizon</div></div>
  <div class="rank"><div class="node" id="analyst" style="--l:70px">analyst</div><div class="node" id="engine">engine</div><div class="node" id="connectors">connectors</div></div>
  <div class="rank"><div class="node" id="agents">agents</div><div class="node" id="ge">ge</div><div class="node" id="spcs" style="--l:70px">spcs</div><div class="node" id="ml">ml</div><div class="node" id="gcp">gcp</div></div>
  <svg id="diagram-svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0,0 L10,5 L0,10 z"/></marker></defs><g></g></svg>
</article>

<script type="module">
import { Connectors } from "./connectors.js";

const EDGES = [
  ["connectors", "gcp"], ["gcs", "horizon"], ["bq", "runtime"], ["horizon", "runtime"],
  ["horizon", "engine"], ["engine", "spcs"], ["engine", "ml"], ["engine", "connectors"],
  ["horizon", "analyst"], ["analyst", "agents"], ["agents", "ge"], ["geap", "agents"],
];

const bends = p => p.slice(2).filter((q, k) => (p[k][0] === p[k + 1][0]) !== (p[k + 1][0] === q[0])).length;
const canvas = document.getElementById("diagram-canvas"), connectors = new Connectors(canvas, EDGES);
const draw = () => {
  const paths = connectors.draw();
  document.getElementById("score").textContent =
    `bends: ${paths.reduce((n, p) => n + bends(p), 0)}  (${EDGES.map(([a, b], i) => `${a}→${b} ${bends(paths[i])}`).join(", ")})`;
};
document.getElementById("toggle").onclick = () => { canvas.classList.toggle("lr"); canvas.classList.toggle("td"); draw(); };
new ResizeObserver(draw).observe(canvas);
</script>
